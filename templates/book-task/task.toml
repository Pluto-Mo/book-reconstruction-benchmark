schema_version = "1.4"
artifacts = ["/app/submission.md"]

[task]
name = "local/book-template"
version = "1.0.0"
description = "Template task for reconstructing one nonfiction book under a fixed compression budget."
authors = []
keywords = ["book-reconstruction", "long-form-writing", "automatic-evaluation"]

[metadata]
author_name = "unknown"
author_email = "unknown"
difficulty = "hard"
category = "book_reconstruction"
tags = ["nonfiction", "high-compression", "v1-template"]
instruction_variant = "natural"
expert_time_estimate_min = 0.0
junior_time_estimate_min = 0.0

[agent]
timeout_sec = 3600.0

# The evaluated agent reads the private book source without network access.
[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 4096

# The verifier is isolated from the agent workspace except for declared
# artifacts. Its image is built from tests/Dockerfile, which copies the
# hidden Book Card and verifier code into /tests.
[verifier]
timeout_sec = 900.0
environment_mode = "separate"

[verifier.environment]
network_mode = "public"
build_timeout_sec = 600.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 4096

# Judge credentials and the frozen judge/model override must be supplied at
# run time through Harbor verifier environment flags, for example:
#   --ve BENCHMARK_JUDGE_MODEL="openai/<frozen-judge-model>"
#   --ve BENCHMARK_JUDGE_API_KEY="$BENCHMARK_JUDGE_API_KEY"
#   --ve BENCHMARK_JUDGE_BASE_URL="$BENCHMARK_JUDGE_BASE_URL"
# Do not commit secrets or silently change the judge between compared runs.
